appId: com.harmonytutor.grandstaff
productName: Harmony Tutor
copyright: Copyright © 2026 Harmony Tutor

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - shared/**/*
  - package.json

extraMetadata:
  main: electron/main.js

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: "${productName}-${version}-mac.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-win.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Audio
  artifactName: "${productName}-${version}-linux.${ext}"

asar: true
