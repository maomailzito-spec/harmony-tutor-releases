appId: com.harmonytutor.grandstaff
productName: Harmony Tutor
copyright: Copyright © 2026 Harmony Tutor

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - shared/**/*
  - package.json

extraResources:
  - from: docs/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  # IL MANUALE VIAGGIA CON L'APPLICAZIONE. Chi compra scarica un file solo e ha
  # dentro anche la guida: niente da cercare sul sito, e soprattutto la guida è
  # quella della versione che sta usando — un manuale scaricato a parte invecchia
  # per conto suo. Cinque megabyte su un pacchetto che ne pesa quasi quattrocento.
  - from: docs/manuali/Harmony_Tutor_Manuale_ITA.pdf
    to: manuali/Harmony_Tutor_Manuale_ITA.pdf
  - from: docs/manuali/Harmony_Tutor_Manual_EN.pdf
    to: manuali/Harmony_Tutor_Manual_EN.pdf

extraMetadata:
  main: electron/main.js
  appFlavor: grandstaff

mac:
  category: public.app-category.music
  notarize: false   # disabled here — handled by build/notarize.js (afterSign hook)
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: "ERMINIO ZITO (6VGJA5UP2N)"
  # Nome artefatto con l'ARCH per zip E dmg, così arm64 e x64 non si sovrascrivono
  # (prima il dmg era "…-mac.dmg" senza arch → restava un solo dmg, quello Intel, e i
  #  Mac Apple Silicon scaricavano la versione sbagliata dal sito).
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"

afterSign: build/notarize.js

fileAssociations:
  - ext: htp
    name: Harmony Tutor Project
    role: Editor
    mimeType: application/x-harmony-tutor

dmg:
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-win.${ext}"

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Audio
  artifactName: "${productName}-${version}-linux.${ext}"

asar: true

publish:
  provider: github
  owner: maomailzito-spec
  repo: harmony-tutor-releases
  private: false

releaseInfo:
  releaseNotesFile: RELEASE_NOTES.md
