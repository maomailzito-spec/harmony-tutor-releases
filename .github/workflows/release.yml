# ──────────────────────────────────────────────────────────
# Harmony Tutor — Automated Release Pipeline
#
# Trigger: push di un tag  v*  (es. v1.0.2)
#   oppure: workflow_dispatch manuale con il numero di versione.
#
# Il workflow:
#   1. Builda il frontend (Vite)
#   2. Builda l'installer macOS (DMG, arm64, firmato + notarizzato)
#   3. Builda l'installer Windows (EXE, x64)
#   4. Crea la GitHub Release e uploada i file
#   5. Aggiorna i link di download sul sito (repo harmonytutor)
#
# Secrets richiesti nel repo harmony-tutor-releases:
#   GH_TOKEN                  — PAT con accesso a entrambi i repo
#   APPLE_CERTIFICATE_P12     — certificato .p12 in base64
#   APPLE_CERTIFICATE_PASSWORD— password del .p12
#   APPLE_ID                  — Apple ID email
#   APPLE_APP_PASSWORD        — app-specific password
#   APPLE_TEAM_ID             — Team ID (default 6VGJA5UP2N)
# ──────────────────────────────────────────────────────────

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.2)"
        required: true

# Annulla run precedenti sullo stesso tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── macOS (arm64, signed + notarized) ─────────────────
  build-mac:
    runs-on: macos-14          # Apple-Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build      # audit + tsc + vite

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "actions" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "actions" build.keychain
          rm /tmp/cert.p12

      - name: Build macOS installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/latest-mac.yml

  # ── Windows (x64) ────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: |
            release/*.exe
            release/latest.yml

  # ── Create Release + Update Website ──────────────────
  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$V"   >> "$GITHUB_OUTPUT"
          echo "tag=v$V"      >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/mac-release/*.dmg
            artifacts/win-release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Update website download links
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/maomailzito-spec/harmonytutor.git" /tmp/site
          cd /tmp/site
          # Replace any previous version in the download URLs
          sed -i "s|releases/download/v[0-9.]*\/Harmony\.Tutor-[0-9.]*-|releases/download/v${VERSION}/Harmony.Tutor-${VERSION}-|g" index.html
          sed -i "s|releases/download/v[0-9.]*\/Harmony\.Tutor-[0-9.]*-|releases/download/v${VERSION}/Harmony.Tutor-${VERSION}-|g" en.html
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html en.html
          git diff --cached --quiet || {
            git commit -m "chore: update download links to v${VERSION}"
            git push
          }
          echo "✅ Website updated to v${VERSION}"
